name: CI

# Verifies all three parts of the platform on every push and PR:
#
#   backend/     1) Fast unit + Cloud Functions contract suite (`npm test`)
#                2) Emulator integration for Hosting + Cloud Functions Gen 2,
#                   proving Firebase ID tokens cannot enter the Supabase-only
#                   profile API or create legacy Firestore profiles.
#   admin_panel/ Flutter Web admin (`flutter analyze`, `flutter test`, and
#                production `flutter build web` targeting Firebase Hosting)
#   legal_app/   Flutter mobile app (`flutter analyze` compile gate + `flutter test`)

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    name: Backend + Firebase Emulators (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Java 21 (for Cloud Firestore Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit & Cloud Functions contract tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/backend-unit.log"

      - name: Verify Supabase-only auth boundary through Hosting + Functions emulators
        shell: bash
        run: |
          set -o pipefail
          mkdir -p admin_panel/build/web
          printf '<!doctype html><html><body>Legal Admin Hosting Check</body></html>\n' > admin_panel/build/web/index.html
          npx --yes firebase-tools@15.34.1 emulators:exec \
            --project legal-102026 \
            --only auth,firestore,functions,hosting \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 RUN_FIRESTORE_E2E=1 npm --prefix backend run test:emulator" \
            2>&1 | tee "$RUNNER_TEMP/backend-emulator.log"

      - name: Publish failure details as annotations
        if: failure()
        shell: bash
        run: |
          publish() {
            local log="$1" title="$2" body encoded
            [ -f "$log" ] || return 0
            body="$(tail -80 "$log")"
            encoded="$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')"
            echo "::error title=${title}::${encoded}"
            echo "----- ${title} (last 80 lines) -----"
            tail -80 "$log"
          }
          publish "$RUNNER_TEMP/backend-unit.log" "backend npm test"
          publish "$RUNNER_TEMP/backend-emulator.log" "backend firebase emulators e2e"

  supabase-edge:
    name: Supabase Edge Function (Deno type check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check authenticated AI Edge Function
        run: deno check supabase/functions/ai-assistant/index.ts

  admin-panel:
    name: Admin panel (analyze + test + web build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin_panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Test web build scripts
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/scripts-test.log"

      - name: Build web bundle (Firebase Hosting target)
        shell: bash
        env:
          # Public client configuration compiled in as Dart defines. Configure
          # the repository variable SUPABASE_ANON_KEY (Settings > Secrets and
          # variables > Actions > Variables) with the project's PUBLIC
          # anon/publishable key; never a service-role/secret key.
          # SUPABASE_URL defaults to the connected project when unset.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_AUTH_REDIRECT_URL: ${{ vars.SUPABASE_AUTH_REDIRECT_URL }}
        # Without the variable this compiles a key-less, non-deployable check
        # into build/web-compile-check (warning annotation) instead of
        # embedding a fake key; invalid values always fail the job.
        run: |
          set -o pipefail
          node scripts/build_web.mjs --allow-unconfigured-compile-check 2>&1 | tee "$RUNNER_TEMP/build-web.log"

      - name: Publish failure details as annotations
        if: failure()
        shell: bash
        run: |
          publish() {
            local log="$1" title="$2" pattern="$3" body encoded
            [ -f "$log" ] || return 0
            body="$(grep -B 6 -A 18 -E "$pattern" "$log" | head -120 || true)"
            [ -n "$body" ] || body="$(tail -40 "$log")"
            encoded="$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')"
            echo "::error title=${title}::${encoded}"
            echo "----- ${title} (last 60 lines) -----"
            tail -60 "$log"
          }
          publish "$RUNNER_TEMP/analyze.log" "flutter analyze" \
            '^[[:space:]]*(error|warning|info)[[:space:]]*[•-]'
          publish "$RUNNER_TEMP/test.log" "flutter test" \
            '\[E\]|Expected:|Actual:|EXCEPTION|failed|Error:'
          publish "$RUNNER_TEMP/scripts-test.log" "web build script tests" \
            '^not ok|AssertionError|Error:'
          publish "$RUNNER_TEMP/build-web.log" "flutter build web" \
            'Error:|Failed|Exception|configuration is invalid'

  legal-app:
    name: Mobile app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: legal_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # legal_app/pubspec.lock requires Flutter >= 3.47.0.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-get.log"

      - name: Report formatting differences
        shell: bash
        run: dart format --output=none --show=changed lib test || true

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Publish failure details as annotations
        if: failure()
        shell: bash
        run: |
          publish() {
            local log="$1" title="$2" pattern="$3" body encoded
            [ -f "$log" ] || return 0
            body="$(grep -E "$pattern" "$log" | grep -v 'google_fonts was unable' | head -60 || true)"
            [ -n "$body" ] || body="$(tail -40 "$log")"
            encoded="$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')"
            echo "::error title=${title}::${encoded}"
            echo "----- ${title} (last 60 lines) -----"
            tail -60 "$log"
          }
          publish_block() {
            local log="$1" title="$2" body encoded
            [ -f "$log" ] || return 0
            body="$(awk '
              /EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK/ { seen++ }
              seen == 1 { print }
              seen == 1 && ++lines > 40 { exit }
            ' "$log" | grep -v 'google_fonts was unable' || true)"
            [ -n "$body" ] || return 0
            encoded="$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')"
            echo "::error title=${title}::${encoded}"
            echo "----- ${title} -----"
            printf '%s\n' "$body"
          }
          publish "$RUNNER_TEMP/pub-get.log" "flutter pub get (legal_app)" \
            'Error:|Exception|Because|version solving|Failed|SocketException'
          publish "$RUNNER_TEMP/analyze.log" "flutter analyze (legal_app)" \
            '^[[:space:]]*(error|warning)[[:space:]]*[•-]'
          publish "$RUNNER_TEMP/test.log" "flutter test (legal_app)" \
            '\[E\]|Expected:|Actual:|EXCEPTION|failed|Error:'
          publish_block "$RUNNER_TEMP/test.log" "flutter test (legal_app) detail"
